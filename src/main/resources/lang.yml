# Lang file for Fundamentals
# You can use colors like '&4' or '<red>'

started: "Started Fundamentals"
stopped: "Stopped Fundamentals"

# Player commands
# Placeholders: %PLAYER%
cmds:
  # Msg
  # Extra placeholders: %OTHER%, %MSG%
  msg:
    log: "%PLAYER% said to %OTHER%: %MSG%"
    send: "&5&lYou &9-> &1&l%OTHER%&9: &r%MSG%"
    receive: "&1&l%PLAYER% &9-> &5&lYou&9: &r%MSG%"
  # Reply (only has error messages, rest is same as msg)
  reply:
    none: "&cNo one to reply to!"
  # Tpa/Tpahere/Tpaccept/Tpdeny/Tpacancel
  # Extra placeholders: %OTHER%
  tpa:
    multiple: "&cYou already have an outgoing tp request! &eCancel it with &l/tpacancel"
    replaced: "&cTp request to &e&llOTHER&c was replaced."
    none: "&cYou have no incoming tp requests!"
    expired:
      log: "%PLAYER%'s request to %OTHER% expired"
      sent: "&cYour teleport request to &1&l%OTHER%&c expired!"
      receive: "&cTeleport request from &1&l%PLAYER%&c expired!"
    cancelled:
      log: "%PLAYER% cancelled request to %OTHER%"
      sent: "&5Cancelled outgoing request to &1&l%OTHER%"
      receive: "&cTpa request from &1&l%PLAYER%&c was cancelled!"
    denied:
      log: "%OTHER% denied request from %PLAYER%"
      sent: "&1&l%OTHER%&c denied your tp request!"
      receive: "&cTpa request from &1&l%PLAYER%&c was denied!"
    request:
      tpa:
        log: "%PLAYER% sent tpa request to %OTHER%"
        sent: "&5Requested to teleport to &1&l%OTHER%"
        receive: "&1&l%PLAYER%&5 has requested to teleport to you. &eUse &l/tpaccept&e to accept this request."
      tpahere:
        log: "%PLAYER% sent tpahere request to %OTHER%"
        sent: "&5Requested &1&l%OTHER%&5 to teleport here."
        receive: "&1&l%PLAYER%&5 has requested you teleport to them. &eUse &l/tpaccept&e to accept this request."
    accepted:
      log: "%OTHER% accepted %PLAYER%'s teleport request"
      sent: "&1&l%OTHER%&5 accepted your teleport request!"
      receive: "&5Accepted &1&l%PLAYER%&5's teleport request!"
    teleporting: "&eDon't move! &dTeleporting in %SECS% seconds!"
    # Countdown: will show in actionbar and can use %SECS% placeholder
    countdown: "&5Teleporting in &l%SECS%&5..."
  # Ignore
  # Extra placeholders: %OTHER%
  ignore:
    ignore:
      log: "%PLAYER% ignored %OTHER%"
      send: "&5Ignored &1&l%OTHER%!"
    unignore:
      log: "%PLAYER% unignored %OTHER%"
      send: "&5Stopped ignoring &1&l%OTHER%"
  # Welcome
  # Extra placeholders: %OTHER%
  welcome:
    log: "%PLAYER% welcomed %OTHER%"
    send: "&1%PLAYER% &5welcomes &1&l%OTHER%&5!"
    # No placeholders, error message
    hasplayedbefore: "&cIt's not the player's first time!"
  # Home command
  home:
    # /homes and /listhomes - comma separated list of homes will be appended after
    list: "&5&lHomes: &e" # home1, home2, etc
    nohomes: "&cYou don't have any homes."
    # /home, /delhome - missing home - can use %HOME% name placeholder
    missing: "&cYou don't have a home named '&l%HOME%&c'"
    # Countdown for /home tp - can use %SECS% placeholder
    countdown: "&5Teleporting in &l%SECS%&5..."
    # /sethome - can use %HOME% name placeholder
    set: "&5Successfully set a home named '&1&l%HOME%&5'"
    setlog: "%PLAYER% created home %HOME%" # Can use %PLAYER% placeholder for log
    conflict: "&cA home named '&l%HOME%&c' already exists!"
    max: "&cYou cannot create more than %MAX% homes!" # Can use %MAX% for max number of homes
    # /delhome - can use %HOME% name placeholder
    deleted: "&5Successfully deleted home '&1&l%HOME%&5'"
    deletedlog: "%PLAYER% deleted home %HOME%" # Can use %PLAYER% placeholder for log
    # All
    error: "&cUnable to load homes, please restart the server." # If homes storage fails to load
    teleporting: "&eDon't move! &dTeleporting in %SECS% seconds!" # Teleporting warning
  # Warp command
  warp:
    # /warp and /listwarps - comma separated list of warps will be appended after
    list: "&5&lAll warps on the server: &e" # cool_build, persons_place, etc.
    nowarps: "&cThere are no warps."
    # /warp, /delwarp - missing warp - can use %WARP% name placeholder
    missing: "&cYou don't have a warp named '&l%WARP%&c'"
    # Countdown for /warp tp - can use %SECS% placeholder
    countdown: "&5Teleporting in &l%SECS%&5..."
    # /setwarp - can use %WARP% name placeholder
    set: "&5Successfully set a warp named '&1&l%WARP%&5'"
    setlog: "%PLAYER% created warp %WARP%" # Can use %PLAYER% placeholder for log
    conflict: "&cA home named '&l%WARP%&c' already exists!"
    max: "&cYou cannot create more than %MAX% warps!" # Can use %MAX% for max number of warps
    # /delwarp - can use %WARP% name placeholder
    deleted: "&5Successfully deleted warp '&1&l%WARP%&5'"
    deletedlog: "%PLAYER% deleted warp %WARP%" # Can use %PLAYER% placeholder for log
    # All
    teleporting: "&eDon't move! &dTeleporting in %SECS% seconds!" # Teleporting warning
  # Random teleport command
  rtp:
    # Countdown for rtp - can use %SECS% placeholder
    countdown: "&5Teleporting in &l%SECS%&5..."
    # Teleporting warning
    teleporting: "&eDon't move! &dTeleporting in %SECS% seconds!"
    # Not allowed in this world!
    in-world-not-allowed: "&cYou can't RTP in this world!"
    other-world-not-allowed: "&cYou can't RTP to that world!"
    # No safe teleport location
    no-safe-location: "&cCouldn't find a safe destination"
    # Logs
    log:
      # Found a safe location, can use %ATTEMPTS% placeholder
      found: "Found safe location for RTP in %ATTEMPTS% attempts."
      # Couldn't find a safe location, can use %ATTEMPTS% placeholder
      failed: "Couldn't find safe location for RTP in %ATTEMPTS% attempts."

  # Ping command, can use %PING% and %PLAYER% placeholder
  ping:
    self: "&5Your ping is &d&l%PING%ms"
    other: "&d%PLAYER%&5's ping is &d&l%PING%ms"

  # Rules command, opens book
  rules:
    title: "Server Rules"
    author: "Fundamentals/Server"

  # Trash command and gui
  trash:
    # Title for inventory
    title: "&5Throw away items"
    # Log, can use %PLAYER%
    log: "%PLAYER% opened trash gui"

  # Send location to another player quickly
  sendloc:
    # Message to be sent as player, can use %PLAYER%, %PX%, %PY%, and %PZ% placeholders
    message: "&aMy location is: &c%PX% &e%PY% &b%PZ%"

  # Kills the player, can use %PLAYER% placeholder
  suicide:
    # Message to player
    msg: "&c ... Ouch."
    # Log message
    log: "%PLAYER% took the hard way out"

  # Seen command, can use placeholders: %PLAYER%, %YEAR%, %MONTHNUM%, %MONTHNAME%, %DATE%, %WEEKDAY%, %24HOUR%, %12HOUR%, %AMPM%, %MINUTE%, %SECOND%
  seen: "&5&lPlayer&5 was last seen on&e %MONTHNUM%/%DATE%/%YEAR%, at %12HOUR%:%MINUTE%:%SECOND% %AMPM%"

  # Hat command, puts item in hand on head
  hat: "&5Plop!"

  # Depth command, can use %DEPTH% placeholder
  depth: "&5Your current distance from sea level is: &e&l%DEPTH%"

# Staff commands
# Placeholders: %PLAYER%, and sometimes %VICTIM% (Player might show up as "CONSOLE" in some cases)
staffcmds:
  # Broadcast
  # log, staff, and player messages, can use %MSG% placeholder
  broadcast:
    log: "%PLAYER% broadcasted: \"%MSG%\""
    staff: "&2&lBroadcasted message:&r %MSG%"
    player: "%MSG%"
  # BroadcastWorld
  # log, staff, and player messages, can use %MSG% and %WORLD% placeholders
  broadcastworld:
    log: "%PLAYER% broadcasted to world %WORLD%: \"%MSG%\""
    staff: "&2&lBroadcasted message to world %WORLD%:&r %MSG%"
    player: "%MSG%"
  # Freeze
  # log, staff, and player messages
  freeze:
    log:
      start: "%PLAYER% froze %VICTIM%!"
      stop: "%PLAYER% unfroze %VICTIM%!"
    staff:
      start: "&cFroze %VICTIM%"
      stop: "&cUnfroze %VICTIM%"
    player:
      start: "&cYou have been frozen!"
      actionbar: "&cYou are frozen"
      stop: "&2You were unfrozen!"
  # Invsee
  # log and staff messages
  invsee:
    log: "%PLAYER% opened %VICTIM%'s inventory!"
    staff: "&2Opened %VICTIM%'s inventory"
  # Staffmsg
  # log, staff, and player messages, can use %MSG% placeholder
  staffmsg:
    log: "%PLAYER% staff-messaged %VICTIM%: %MSG%"
    staff: "&4&lStaff &c-> &a&l%VICTIM%&4: &r%MSG%"
    player: "&4&lStaff &c-> &a&lYou&4: &r%MSG%"
  # Staffmode
  # log and staff message, %VICTIM% placeholder only if a name was entered (/staffmode [player to spectate - not required])
  staffmode:
    log:
      enter: "%PLAYER% entered staffmode"
      exit: "%PLAYER% exited staffmode"
    staff:
      enter: "&bEntered staffmode"
      exit: "&bExited staffmode"
    addon: ", spectating %VICTIM%"
  # Feed
  feed:
    log: "%PLAYER% fed %VICTIM%"
    staff: "&6Fed %VICTIM%"
  # Feed
  heal:
    log: "%PLAYER% healed %VICTIM%"
    staff: "&6Healed %VICTIM%"
  # Gamemode
  # %GM% placeholder
  gamemode:
    log: "%PLAYER% changed %VICTIM%'s gamemode to %GM%"
    staff: "&5Changed &d%VICTIM%&5's gamemode to &b&l%GM%"
  # Tpoffline
  tpo:
    log: "%PLAYER% teleported to offline player %VICTIM%"
    staff: "&5Teleported to &d%VICTIM%&5!"
  # Fly
  fly:
    enter:
      log: "%PLAYER% entered fly!"
      staff: "&5Entered fly mode!"
    exit:
      log: "%PLAYER% exited fly!"
      staff: "&5Exited fly mode!"
    # Already in a flying gamemode
    gamemode: "&c%PLAYER% can already fly (gamemode)!"
  # Enderchest command (staff/player)
  enderchest:
    log:
      player: "%PLAYER% opened their enderchest."
      staff: "%PLAYER% opened %OTHER%'s enderchest."
    message:
      player: "&5Opened your enderchest!"
      staff: "&5Opened &d%OTHER%&5's enderchest!"
  # Fundamentals command
  fundamentals:
    reloadconfig:
      log: "%PLAYER% reloaded fundamentals config!"
      staff: "&5Reloading fundamentals config..."
      notice: "&eSome changes may not take effect until a server restart."
    enablecommand:
      log: "%PLAYER% enabled command %COMMAND%"
      staff: "&5Enabled command %COMMAND%!"
      state: "&c%COMMAND% is already enabled."
    disablecommand:
      log: "%PLAYER% disabled command %COMMAND%"
      staff: "&5Disabled command %COMMAND%!"
      state: "&c%COMMAND% is already disabled."
  # Socialspy
  socialspy:
    enable:
      log: "%PLAYER% enabled socialspy"
      staff: "&5You can now see all private messages."
    disable:
      log: "%PLAYER% disabled socialspy"
      staff: "&5You can no longer see all private messages"
    # Can use %PLAYER%, %OTHER%, and %MSG%. Just like normal /msg command
    msg: "&5&l%PLAYER% &9-> &5&l%OTHER%&9: &r%MSG%"
  # Sudo command, can use %PLAYER%, %VICTIM%, %CMD%
  sudo:
    log: "%PLAYER% ran command as %VICTIM%: %CMD%"
    staff: "&5Ran command as &d&l%VICTIM%&5: &r%CMD%"
    # Non-operators can't sudo operators or players with fundamentals.staff.sudo.exempt. Can use %VICTIM%
    exempt: "&cCan't sudo &e&l%VICTIM%"
  # clearchat command, can use %PLAYER%, %LINES%
  clearchat:
    log: "%PLAYER% cleared chat (%LINES% lines)"
    staff: "&5Cleared chat!"
  # Summons a tnt, can use %PLAYER% and %TARGETS%
  nuke:
    # Log message
    log: "%PLAYER% bombed %TARGETS%"
    # Staff response
    staff: "&dBombed %TARGETS%"
    # Message sent to targeted players
    message: "&5May death rain upon them."
  # Summons a huge circle of tnt, can use %PLAYER% and %TARGET%
  bignuke:
    # Log message
    log: "%PLAYER% bombed %TARGET%"
    # Staff response
    staff: "&dSummoned nuke at %TARGET%"
  # Renames an item, can use %PLAYER%, %ITEM% (material name), and %NAME% (new name set)
  rename:
    # Log message
    log: "%PLAYER% renamed %ITEM% to %NAME%"
    # Response
    staff: "&5Renamed %ITEM% to %NAME%!"
    # Changes an items lore, can use %PLAYER%, %ITEM% (material name), and %LORE% (new lore set)
  lore:
    # Log message
    log: "%PLAYER% changed %ITEM% lore to %LORE%"
    # Response
    staff: "&5Changed lore!"
  # Brings item to max stack size (or 64 if non-stackable), can use %PLAYER%, %ITEM%, %AMOUNT%, and %NEWAMOUNT%
  more:
    # Staff message on use
    staff: "&5Gave you more!"
    # Console message
    log: "Stacked item %ITEM% from %AMOUNT% to %NEWAMOUNT% for %PLAYER%"
  # Skull command, can use %PLAYER%, %TARGET% (whose skull to give)
  skull:
    # Message on success
    staff: "&5Gave you %TARGET%'s skull!"
    # Console message on success
    log: "%PLAYER% got %TARGET%'s skull."
    # Failed lookup
    fail: "&cPlayer lookup failed"
  # Get position command, can use %PLAYER% (executor), %VICTIM% (player being targeted), %PX% (x), %PY% (y), %PZ% (z), %PWORLD% (current world name)
  getpos: "&d&l%VICTIM%&5 is at &e&l%PX%&e, &l%PY%&e, &l%PZ%&5 in world '&e%PWORLD%&5'"
  # Smite command, can use %PLAYER% and %TARGET%
  smite:
    staff: "&dThou (&e&l%TARGET%&d) hast been smitten"
    log: "%PLAYER% smite-d %TARGET%"
  # Extinguish command
  extinguish:
    staff: "&dExtinguished %TARGET%"
    log: "%PLAYER% extinguished %TARGET%"
  # Rest command
  rest:
    staff: "&dRested %TARGET%"
    log: "%PLAYER% rested %TARGET%"
  # Top command, can use %TARGET%, %PLAYER%, %BX%, %BY%, %BZ% (block x, y, and z)
  top:
    staff: "&5Brought %TARGET% up!"
    log: "%PLAYER% put %TARGET% on top block (at x %BX% y %BY% z %BZ%)"
    fail: "&cCouldn't find a passable top block."
  # Bottom command, can use %TARGET%, %PLAYER%, %BX%, %BY%, %BZ% (block x, y, and z)
  bottom:
    staff: "&5Brought %TARGET% down!"
    log: "%PLAYER% put %TARGET% on bottom block (at x %BX% y %BY% z %BZ%)"
    fail: "&cCouldn't find a passable bottom block."
  # Serverstat command, can use %ONLINE% / %MAX% / %VERSION% / %MEMUSED% / %MEMFREE% / %MEMTOTAL% / %MEMMAX% / %WORLDS% / %UPTIME% / %TPS1M% / %TPS5M% / %TPS15M%
  serverstat: |
    &5&lServer stats
    &6Players:&e %ONLINE%&6/&e%MAX%&6
    &6Version:&e %VERSION%
    &6Heap usage:&e %MEMUSED%mb / %MEMTOTAL%mb (%MEMFREE%mb free, %MEMMAX%mb max)
    &6Worlds:&e %WORLDS%
    &6Uptime:&e %UPTIME% seconds
    &6TPS (1m, 5m, 15m):&e %TPS1M%, %TPS5M%, %TPS15M%
  # Whois command, can use %TARGET% / %PIP% / %PPORT%
  whois: |
    &5&lInformation on %TARGET%:
    &6IP address: %PIP% (port %PPORT%)
    

# No placeholders, extra messages
msgs:
  playeronly: "&cThis command can only be run by a player."
  disabled: "&cThis command is disabled."
  notfound: "&cCommand not implemented."
  offline: "&cPlayer is not online."
  playernotfound: "&cThat player couldn't be found!"
  invalid: "&cInvalid argument!"
  fileerror: "&cAn error occurred and the server couldn't save that change."
  readerror: "&cThe server failed to read required data from disk."
  generalerror: "&cAn error occurred, please try again."
  ignored: "&cThis player is ignoring you!"
  self: "&cYou can't use this command on yourself!"
  tpcancelled: "&cYou moved!"
  cooldown: "&cYou must wait %SECS% seconds before using this command again."
  noperms: "&cYou don't have permission to do that."
  nullmeta: "&cThis item has invalid metadata, sorry!"
  no-item: "&cYou need to hold an item!"

# Most non-command chat messages
# Can use %PLAYER% placeholder for most
chat:
  # All chat
  # Can use %MSG% placeholder
  format: "&7%PLAYER%: %MSG%"
  # Joins
  join: "&f&l[&a&l+&f&l] &7%PLAYER%"
  firstjoin: "&a&l%PLAYER% joined the server for the first time! &5Everyone welcome &1&l%PLAYER%&5!"
  leave: "&f&l[&c&l-&f&l] &7%PLAYER%"
  # Death message
  # Can use %DEATH% placeholder
  death: "&c☠ %PLAYER% %DEATH%"
  # Messages
  # No placeholders
  nolinks: "&cYou can't use links in chat!"
  disallowed: "&cThat's not appropriate!"

# OpChecker logging
ops:
  # %CMD%, %EXECUTOR%, and %PLAYER% will be replaced where applicable
  # When op/deop are run from console (pretty reliable)
  console:
    op: "Console op'd! %CMD%"
    deop: "Console deop'd! %CMD%"
  # When a player runs op/deop (unreliable)
  player:
    op: "Player %EXECUTOR% op'd! %CMD%"
    deop: "Player %EXECUTOR% deop'd! %CMD%"
  # When the plugin detects a player has gained or lost the op permission via Bukkit API (most reliable/useful)
  detect:
    op: "%PLAYER% was opped!"
    deop: "%PLAYER% was deopped!"