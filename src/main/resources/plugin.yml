name: "Fundamentals"
description: "Everything you need for your server, all in one package."
prefix: "Fundamentals"
version: ${project.version}

main: io.github.sebminecrafter.fundamentals.Main
api-version: '26.1'
load: STARTUP

authors: [ "Sebminecrafter" ]
website: "https://github.com/Sebminecrafter/Fundamentals"

commands:
  # Staff commands
  broadcast:
    description: "Broadcast a message to everyone online"
    usage: "Usage: /<command> <message>"
    permission: fundamentals.staff.broadcast
    aliases: ['bc', 'announce', 'bcast', 'shout']
  staffmode:
    description: "Enter staff mode"
    usage: "Usage: /<command> [player]"
    permission: fundamentals.staff.staffmode
    aliases: ['sm', 'spectate']
  invsee:
    description: "View a player's inventory"
    usage: "Usage: /<command> <player>"
    permission: fundamentals.staff.invsee
    aliases: ['inventorysee']
  freeze:
    description: "Freeze a player"
    usage: "Usage: /<command> <player>"
    permission: fundamentals.staff.freeze
    aliases: []
  staffmsg:
    description: "Message a player as \"staff\""
    usage: "Usage: /<command> <player> <message>"
    permission: fundamentals.staff.staffmsg
    aliases: []
  feed:
    description: "Fill a player's hunger"
    usage: "Usage: /<command> [player]"
    permission: fundamentals.staff.feed
    aliases: []
  heal:
    description: "Fill a player's health"
    usage: "/<command> [player]"
    permission: fundamentals.staff.heal
    aliases: []
  gamemode:
    description: "Change gamemode"
    usage: "Usage: /<command> [player] <gamemode>"
    permission: fundamentals.staff.gamemode
    aliases: ['gm', 'gms', 'gmc', 'gma', 'gmsp']
  tpo:
    description: "Teleport to an offline player"
    usage: "Usage: /<command> <target>"
    permission: fundamentals.staff.tpo
    aliases: ['tpoffline']
  fly:
    description: "Enable fly mode"
    usage: "Usage: /<command> [player]"
    permission: fundamentals.staff.fly
    aliases: []
  fundamentals:
    description: "Plugin configuration"
    usage: "Usage: /<command> <help/reloadconfig/enablecommand/disablecommand> [command]"
    permission: fundamentals.staff.fundamentals
    aliases: []
  socialspy:
    description: "Start listening to other's private messages"
    usage: "Usage: /<command>"
    permission: fundamentals.staff.socialspy
    aliases: ['ss', 'listen']
  sudo:
    description: "Run a command as another player"
    usage: "Usage: /<command> <player> <cmd>"
    permission: fundamentals.staff.sudo
    aliases: []
  clearchat:
    description: "Clear chat"
    usage: "Usage: /<command> [lines]"
    permission: fundamentals.staff.clearchat
    aliases: ['cc']
  nuke:
    description: "Summon TNT on player(s)"
    usage: "Usage: /<command> [player]..."
    permission: fundamentals.staff.nuke
    aliases: ['bomb', 'tnt']
  bignuke:
    description: "Huge nuke"
    usage: "Usage: /<command> [player]"
    permission: fundamentals.staff.bignuke
    aliases: ['destroy']
  rename:
    description: "Rename an item"
    usage: "Usage: /<command> <new name>"
    permission: fundamentals.staff.rename
    aliases: ['renameitem', 'changename']
  more:
    description: "Get the max amount of the item in your hand"
    usage: "Usage: /<command>"
    permission: fundamentals.staff.more
    aliases: ['fullstack', 'fillitems']
  # Player commands
  msg:
    description: "Message a player"
    usage: "Usage: /<command> <player> <message>"
    permission: fundamentals.player.msg
    aliases: ['w', 'whisper']
  reply:
    description: "Reply to last message"
    usage: "/<command> <message>"
    permission: fundamentals.player.reply
    aliases: ['r']
  ignore:
    description: "Ignore a player's messages and tp requests"
    usage: "Usage: /<command> <player>"
    permission: fundamentals.player.ignore
    aliases: ['block']
  tpa:
    description: "Teleport requests"
    usage: "Usage varies: /tpa <player>, /tpahere <player>, /tpacancel, /tpaccept [player], /tpdeny [player]"
    permission: fundamentals.player.tpa
    aliases: ['tpaccept', 'tpdeny', 'tpacancel', 'tpahere']
  rtp:
    description: "Teleport to a random location"
    usage: "/<command> [dimension]"
    permission: fundamentals.player.rtp
    aliases: ['tpr', 'tprandom', 'randomtp', 'randomteleport', 'teleportrandom']
  home:
    description: "Homes"
    usage: "Usage varies: /home <name>, /sethome <name>, /delhome <name>, /listhomes, /homes"
    permission: fundamentals.player.homes
    aliases: ['sethome', 'delhome', 'listhomes', 'homes']
  warp:
    description: "Warps"
    usage: "Usage varies: /warp <name>, /setwarp <name>, /delwarp <name>, /listwarps, /warps"
    permission: fundamentals.player.warps
    aliases: [ 'setwarp', 'delwarp', 'listwarps', 'warps' ]
  welcome:
    description: "Welcome a player"
    usage: "/<command> <player>"
    permission: fundamentals.player.welcome
    aliases: ['greet']
  enderchest:
    description: "Open your or another player's enderchest"
    usage: "/<command> [player]"
    permission: fundamentals.player.enderchest
    aliases: ['ec']
  ping:
    description: "Check your or another player's ping"
    usage: "/<command> [player]"
    permission: fundamentals.player.ping
    aliases: []
  rules:
    description: "Shows rules in a book"
    usage: "/<command>"
    permission: fundamentals.player.rules
    aliases: ['rulebook']
  trash:
    description: "Opens a gui for disposing items"
    usage: "/<command>"
    permission: fundamentals.player.trash
    aliases: ['disposal', 'wastebin']
  sendloc:
    description: "Send your location to another player quickly"
    usage: "/<command> <player>"
    permission: fundamentals.player.sendloc
    aliases: ['sendlocation', 'shareloc', 'sharelocation']

default-permission: op
permissions:
  fundamentals.staff:
    description: "Staff commands parent permission"
    default: op
    children:
      fundamentals.staff.broadcast:
        description: "Ability to use the broadcast command"
      fundamentals.staff.freeze:
        description: "Ability to use the freeze command to freeze players"
      fundamentals.staff.invsee:
        description: "Ability to use the invsee command to view a player's inventory"
      fundamentals.staff.staffmsg:
        description: "Ability to use the staffmsg command on players"
      fundamentals.staff.staffmode:
        description: "Ability to use the staffmode command"
      fundamentals.staff.feed:
        description: "Ability to use the feed command on players"
      fundamentals.staff.heal:
        description: "Ability to use the heal command on players"
      fundamentals.staff.tpo:
        description: "Ability to use the tpoffline command"
      fundamentals.staff.fly:
        description: "Ability to use the fly command"
      fundamentals.staff.fundamentals:
        description: "Ability to reload and change settings of the plugin"
      fundamentals.staff.enderchest:
        description: "Open OTHER players enderchest"
      fundamentals.staff.socialspy:
        description: "Use socialspy command to see all private messages"
      fundamentals.staff.sudo:
        description: "WARNING: ALLOWS HIGHER PRIVILEGE EXECUTION OF COMMANDS. Run a command as another player"
      fundamentals.staff.clearchat:
        description: "Clear chat"
      fundamentals.staff.nuke:
        description: "Summon a tnt on one or multiple people"
      fundamentals.staff.rename:
        description: "Rename an item"
      fundamentals.staff.more:
        description: "Get a full stack of an item"
  fundamentals.player:
    description: "Player commands parent permission"
    default: true
    children:
      fundamentals.player.msg:
        description: "Message other players privately"
      fundamentals.player.reply:
        description: "Reply to the last private message"
      fundamentals.player.ignore:
        description: "Ignore messages and tp requests from a player"
      fundamentals.player.tpa:
        description: "Request to teleport to players"
      fundamentals.player.homes:
        description: "Set, delete, and teleport to, homes"
      fundamentals.player.warps:
        description: "Set, delete, and teleport to, warps"
      fundamentals.player.welcome:
        description: "Welcome a player!"
      fundamentals.player.enderchest:
        description: "Open own enderchest with command"
      fundamentals.player.ping:
        description: "Use ping command to check player ping"
      fundamentals.player.rtp:
        description: "Random teleport"
      fundamentals.player.rules:
        description: "Rules command"
      fundamentals.player.trash:
        description: "Use a trash gui to dispose of items"
      fundamentals.player.sendloc:
        description: "Send your location to another player quickly"